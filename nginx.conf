# Сайт agapedesign.ru → /etc/nginx/sites-available/agape
# CMS (Directus) — отдельный файл: /etc/nginx/sites-available/cms (см. docs/DIRECTUS-VPS-DEPLOY.md)
#
# Канонический URL: https://agapedesign.ru (www редиректится на apex).
# Статика: /var/www/agape/frontend/dist после npm run build
# SSL: certbot --nginx -d agapedesign.ru -d www.agapedesign.ru

# HTTP → сразу на канонический HTTPS (apex)
server {
    listen 80;
    server_name agapedesign.ru www.agapedesign.ru;
    return 301 https://agapedesign.ru$request_uri;
}

# HTTPS www → канонический apex
server {
    listen 443 ssl http2;
    server_name www.agapedesign.ru;

    ssl_certificate     /etc/letsencrypt/live/agapedesign.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agapedesign.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://agapedesign.ru$request_uri;
}

# Основной сайт + API
server {
    listen 443 ssl http2;
    server_name agapedesign.ru;

    ssl_certificate     /etc/letsencrypt/live/agapedesign.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agapedesign.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /var/www/agape/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    add_header X-Content-Type-Options   nosniff;
    add_header X-Frame-Options          DENY;
    add_header X-XSS-Protection         "1; mode=block";
    add_header Referrer-Policy          strict-origin-when-cross-origin;
}
